<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

:root{
  --ink:#07070A;
  --charcoal:#131318;
  --charcoal-2:#1B1B22;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.16);
  --text:#F4F4F6;
  --muted:#9A9AA6;
  --faint:#6C6C79;
  --orange:#FF6B00;
  --orange-soft:rgba(255,107,0,.14);
  --r:12px;
  --shadow:0 18px 40px -18px rgba(0,0,0,.85), 0 2px 8px rgba(0,0,0,.4);
  --display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(255,107,0,.13), transparent 60%),
    radial-gradient(700px 420px at 92% 0%, rgba(120,120,255,.06), transparent 55%),
    var(--ink);
  color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:#2C2C36;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#3A3A46}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}

.glass{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(7,7,10,.72);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1900px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--orange),#B33F00);box-shadow:0 0 0 1px rgba(255,107,0,.35),0 8px 20px -8px var(--orange)}
.mark svg{width:19px;height:19px}
.brand h1{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.2px;margin:0;white-space:nowrap}
.brand h1 span{color:var(--orange)}
.brand small{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.hspacer{flex:1}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;width:min(360px,38vw);
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:10px;transition:.2s}
.search:focus-within{border-color:rgba(255,107,0,.55);background:rgba(255,107,0,.06)}
.search input{background:none;border:0;outline:0;width:100%}
.search input::placeholder{color:var(--faint)}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);
  background:rgba(255,255,255,.04);position:relative;transition:.18s}
.iconbtn:hover{border-color:var(--line-2);transform:translateY(-1px)}
.iconbtn.on{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.dot{position:absolute;top:7px;right:7px;min-width:15px;height:15px;padding:0 3px;border-radius:99px;background:var(--orange);
  color:#111;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--ink)}
.avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12.5px;
  background:linear-gradient(150deg,#2A2A34,#16161C);border:1px solid var(--line-2)}
.tabs{display:flex;gap:2px;padding:0 20px 10px;max-width:1900px;margin:0 auto;overflow-x:auto}
.tab{padding:7px 14px;border-radius:99px;color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap;transition:.18s}
.tab:hover{color:var(--text)}
.tab.on{background:var(--orange-soft);color:var(--orange);box-shadow:inset 0 0 0 1px rgba(255,107,0,.3)}

main{max-width:1900px;margin:0 auto;padding:18px 20px 60px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:18px}
.stat{padding:12px 13px;border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid var(--line);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c,var(--orange));opacity:.85}
.stat b{display:block;font-family:var(--display);font-size:22px;letter-spacing:-.5px;line-height:1.15}
.stat i{font-style:normal;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.stat em{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:3px}

/* ---------- filters ---------- */
.filters{display:none;gap:10px;flex-wrap:wrap;align-items:end;padding:14px;margin-bottom:16px}
.filters.open{display:flex}
.fgroup{display:flex;flex-direction:column;gap:5px}
.fgroup label{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
select,input[type=text],input[type=password],input[type=date],input[type=number],input[type=email],input[type=tel],input[type=url],textarea{
  background:#101015;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:0;transition:.18s;color:var(--text)}
select:focus,input:focus,textarea:focus{border-color:rgba(255,107,0,.6);box-shadow:0 0 0 3px rgba(255,107,0,.1)}
textarea{resize:vertical;min-height:64px;width:100%}
/* Keep autofilled fields dark with light text (browsers force a white bg otherwise) */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,textarea:-webkit-autofill,select:-webkit-autofill{
  -webkit-text-fill-color:var(--text)!important;caret-color:var(--text);
  -webkit-box-shadow:0 0 0 1000px #101015 inset!important;box-shadow:0 0 0 1000px #101015 inset!important;
  transition:background-color 9999s ease-in-out 0s}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:305px;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:start}
.col{border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.042),rgba(255,255,255,.012));
  border:1px solid var(--line);display:flex;flex-direction:column;max-height:calc(100vh - 260px);transition:.2s}
.col.over{border-color:var(--k);background:color-mix(in srgb,var(--k) 10%,transparent);transform:scale(1.008)}
.colhead{padding:13px 13px 11px;border-bottom:1px solid var(--line);position:sticky;top:0;border-radius:14px 14px 0 0;
  background:rgba(19,19,24,.9);backdrop-filter:blur(10px);z-index:2}
.colhead .row{display:flex;align-items:center;gap:8px}
.pip{width:7px;height:7px;border-radius:99px;background:var(--k);box-shadow:0 0 10px var(--k);flex:none}
.colhead h3{margin:0;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:-.1px;flex:1}
.count{font-family:var(--mono);font-size:11px;color:var(--k);background:color-mix(in srgb,var(--k) 16%,transparent);
  padding:2px 7px;border-radius:99px}
.colhead p{margin:6px 0 0;font-size:10.5px;color:var(--faint);line-height:1.35}
.add{margin-top:10px;width:100%;padding:7px;border-radius:9px;border:1px dashed var(--line-2);color:var(--muted);
  font-size:12px;font-weight:600;transition:.18s}
.add:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}
.cards{padding:11px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:90px}
.empty{text-align:center;color:var(--faint);font-size:11.5px;padding:22px 8px;border:1px dashed var(--line);border-radius:10px}

.card{border-radius:var(--r);padding:12px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.022));
  border:1px solid var(--line);box-shadow:var(--shadow);cursor:grab;position:relative;transition:transform .18s,border-color .18s,box-shadow .18s;
  animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(7px) scale(.985)}}
.card:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:0 22px 44px -20px rgba(0,0,0,.95)}
.card.dragging{opacity:.42;transform:rotate(1.6deg) scale(.98);cursor:grabbing}
.card .top{display:flex;gap:8px;align-items:flex-start}
.card h4{margin:0;font-family:var(--display);font-size:13.5px;font-weight:600;letter-spacing:-.1px;flex:1;line-height:1.3}
.kebab{width:24px;height:24px;border-radius:7px;color:var(--faint);display:grid;place-items:center;flex:none}
.kebab:hover{background:rgba(255,255,255,.08);color:var(--text)}
.who{font-size:11.5px;color:var(--muted);margin:5px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{font-size:10px;padding:2.5px 7px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip.svc{border-color:rgba(255,107,0,.32);color:#FFAE70;background:rgba(255,107,0,.08)}
.pri{font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:2.5px 7px;border-radius:99px;text-transform:uppercase}
.pri.High{background:rgba(255,64,64,.16);color:#FF8A8A}
.pri.Medium{background:rgba(255,176,32,.15);color:#FFC978}
.pri.Low{background:rgba(120,220,160,.13);color:#8FE3B4}
.line{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:6px}
.line svg{width:12px;height:12px;color:var(--faint);flex:none}
.note{margin-top:9px;padding:7px 9px;border-radius:9px;background:rgba(255,255,255,.035);font-size:11px;color:var(--muted);
  border-left:2px solid var(--line-2)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--faint)}
.stars{color:var(--orange);font-size:10px;letter-spacing:1px}
.due{color:#FF8A8A;font-weight:600}


/* compact cards */
.card.slim{padding:9px 10px 8px}
.card.slim .top{align-items:center;gap:7px}
.card.slim h4{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.slim .kebab{width:20px;height:20px;font-size:12px;opacity:0;transition:.15s}
.card.slim:hover .kebab,.card.slim:focus-within .kebab{opacity:1}
.pdot{width:7px;height:7px;border-radius:99px;flex:none}
.pdot.High{background:#FF5B5B;box-shadow:0 0 8px rgba(255,91,91,.6)}
.pdot.Medium{background:#FFB020}
.pdot.Low{background:#5FD39B}
.srow{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:var(--muted)}
.srow .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow b{font-family:var(--mono);font-size:11px;color:var(--text);font-weight:500}
.srow.sub{font-size:10.5px;color:var(--faint);margin-top:3px}
.card.slim .due{color:#FF8A8A;font-weight:600}

/* ---------- menu ---------- */
.menu{position:fixed;z-index:200;min-width:186px;padding:6px;border-radius:12px;background:#15151B;border:1px solid var(--line-2);
  box-shadow:0 24px 60px -12px rgba(0,0,0,.9);animation:pop .14s ease both}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--text);text-align:left}
.menu button:hover{background:rgba(255,107,0,.14);color:var(--orange)}
.menu button.danger:hover{background:rgba(255,64,64,.15);color:#FF8A8A}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
.menu .head{padding:6px 10px 4px;font-size:10px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:300;background:rgba(4,4,7,.72);backdrop-filter:blur(6px);display:grid;place-items:center;
  padding:18px;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(940px,100%);max-height:92vh;overflow:auto;border-radius:16px;background:#111116;border:1px solid var(--line-2);
  box-shadow:0 40px 90px -20px #000;animation:rise .26s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.sheet header{position:sticky;top:0;z-index:5;padding:16px 20px;display:flex;align-items:center;gap:12px;
  background:rgba(17,17,22,.95);border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-family:var(--display);font-size:17px;font-weight:600;flex:1}
.sheet .body{padding:18px 20px}
.sec{margin-bottom:20px}
.sec>h5{margin:0 0 11px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);
  display:flex;align-items:center;gap:9px}
.sec>h5::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:11px;color:var(--muted);font-weight:500}
.f label b{color:var(--orange)}
.f input,.f select{width:100%}
.wide{grid-column:1/-1}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5.5px 11px;border-radius:99px;border:1px solid var(--line);font-size:11.5px;color:var(--muted);transition:.15s}
.pill:hover{border-color:var(--line-2);color:var(--text)}
.pill.on{background:var(--orange-soft);border-color:rgba(255,107,0,.55);color:var(--orange);font-weight:600}
.rate{display:flex;gap:4px;font-size:19px;color:#3A3A46}
.rate span{cursor:pointer;transition:.15s}
.rate span.on{color:var(--orange);text-shadow:0 0 14px rgba(255,107,0,.5)}
.actions{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;
  background:rgba(17,17,22,.95);border-top:1px solid var(--line)}
.btn{padding:9px 17px;border-radius:10px;font-weight:600;font-size:13px;border:1px solid var(--line-2);color:var(--text);transition:.18s}
.btn:hover{background:rgba(255,255,255,.07)}
.btn.primary{background:linear-gradient(150deg,var(--orange),#D94F00);border-color:transparent;color:#150A00;
  box-shadow:0 10px 26px -10px var(--orange)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.drop{border:1px dashed var(--line-2);border-radius:10px;padding:16px;text-align:center;color:var(--faint);font-size:12px;cursor:pointer}
.drop:hover{border-color:var(--orange);color:var(--orange)}
.filelist{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.file{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.04);font-size:12px}
.file b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- detail ---------- */
.dgrid{display:grid;grid-template-columns:1.25fr .85fr;gap:18px}
@media(max-width:760px){.dgrid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:12.5px}
.kv i{font-style:normal;color:var(--faint)}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:var(--line-2)}
.tl .it{position:relative;padding:0 0 13px}
.tl .it::before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:99px;background:var(--orange);
  box-shadow:0 0 0 3px rgba(255,107,0,.16)}
.tl .it b{font-size:12.5px;font-weight:600;display:block}
.tl .it i{font-style:normal;font-size:10.5px;color:var(--faint)}
.notewrap{display:flex;flex-direction:column;gap:9px;max-height:290px;overflow:auto}
.nitem{padding:10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.nitem .h{display:flex;gap:8px;align-items:center;font-size:10.5px;color:var(--faint);margin-bottom:5px}
.nitem .h b{color:var(--orange);font-weight:600}
.nitem p{margin:0;font-size:12.5px;white-space:pre-wrap}
.nitem .x{margin-left:auto;color:var(--faint);font-size:11px}
.nitem .x:hover{color:#FF8A8A}

/* ---------- analytics ---------- */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.panel{padding:16px;border-radius:14px}
.panel h3{margin:0 0 3px;font-family:var(--display);font-size:14px;font-weight:600}
.panel p.sub{margin:0 0 14px;font-size:11px;color:var(--faint)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:112px 1fr 52px;align-items:center;gap:10px;font-size:11.5px}
.bar .t{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),#FFA35C);transition:width .7s cubic-bezier(.2,.9,.3,1)}
.bar .v{text-align:right;font-family:var(--mono);font-size:11px;color:var(--text)}
.funnel{display:flex;flex-direction:column;gap:7px}
.fstep{padding:10px 13px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(90deg,color-mix(in srgb,var(--k) 26%,transparent),transparent);border-left:3px solid var(--k);
  font-size:12.5px;transition:width .7s cubic-bezier(.2,.9,.3,1)}
.fstep b{font-family:var(--mono);font-size:12px}
.cols6{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:8px}
.cbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.cbar .b{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--orange),rgba(255,107,0,.22));
  min-height:3px;transition:height .8s cubic-bezier(.2,.9,.3,1)}
.cbar span{font-size:9.5px;color:var(--faint)}
.cbar em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:11.5px;flex:1;min-width:130px}
.legend div{display:flex;align-items:center;gap:8px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.calhead h3{font-family:var(--display);font-size:17px;margin:0;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dow{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;text-align:center;padding-bottom:3px}
.day{min-height:96px;border-radius:11px;padding:7px;background:rgba(255,255,255,.03);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px}
.day.mute{opacity:.32}
.day.today{border-color:var(--orange);background:rgba(255,107,0,.08)}
.day .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.day.today .n{color:var(--orange);font-weight:700}
.ev{font-size:9.5px;padding:3px 5px;border-radius:6px;background:color-mix(in srgb,var(--k) 22%,transparent);
  color:var(--k);border-left:2px solid var(--k);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
@media(max-width:720px){.cal{gap:4px}.day{min-height:70px;padding:4px}.ev{font-size:8px}}

/* ---------- misc ---------- */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:500;padding:11px 18px;border-radius:11px;
  background:#1A1A21;border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:13px;animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translate(-50%,14px)}}
.toast b{color:var(--orange)}
.nlist{position:fixed;z-index:200;width:min(340px,92vw);max-height:60vh;overflow:auto;border-radius:14px;background:#15151B;
  border:1px solid var(--line-2);box-shadow:0 30px 70px -14px #000;padding:8px;animation:pop .16s ease both}
.nlist .head{padding:8px 10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

<!-- Supabase client (cloud database). Loaded from CDN; harmless if you haven't
     configured your keys yet — the app falls back to browser storage. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* PHOENIXX IT Dashboard — client pipeline */
(() => {
"use strict";

const COLS = [
  { id:"discovery",  t:"Discovery & Research",  d:"Companies researched and qualified.", c:"#9AA3B2" },
  { id:"approached", t:"Client Approached",     d:"Contacted by phone, email or LinkedIn.", c:"#4C9AFF" },
  { id:"meeting",    t:"Meeting Scheduled",     d:"Meeting booked or discussion ongoing.", c:"#A57BFF" },
  { id:"proposal",   t:"Proposal Shared",       d:"Proposal sent, awaiting a decision.", c:"#FF6B00" },
  { id:"converted",  t:"Onboarded / Converted", d:"Signed, onboarded and billing.", c:"#35C97A" },
  { id:"lost",       t:"Not Converted",         d:"Lost, declined or gone cold.", c:"#FF4D4D" }
];
const COL = id => COLS.find(c => c.id === id) || COLS[0];

const SERVICES = ["Website Development","Mobile App","Digital Marketing","SEO","Google Ads","Meta Ads","Branding","ERP","CRM","AI Automation","Software Development","Cloud","Other"];
const SOURCES  = ["Cold Call","Reference","LinkedIn","Website","Google","Instagram","Facebook","Walk-in","Event","Other"];
const TAGS     = ["Construction","Retail","Education","Sports","Healthcare","Real Estate","Manufacturing","Startup","Corporate"];

/* ---------- cloud database (Supabase) ----------

   the cloud so the whole team shares one live board. Leave them blank to fall
   back to this browser's local storage. See README for the 5-minute setup. */
const SUPABASE_URL  = "https://pemvjqnxhvoaheuznkfc.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlbXZqcW54aHZvYWhldXpua2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzMxMjYsImV4cCI6MjEwMDQ0OTEyNn0.SOdvfolcfWdUq04nWtlVVgm-bBUjnKcODnjjGAuyd6A";
const sb = (SUPABASE_URL && SUPABASE_ANON && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON)
  : null;
let lastStamp = null;       // remote updated_at we last loaded, to detect others' changes

/* ---------- access control ---------- */
/* Change this passcode to control who gets Admin (pricing & revenue) access. */
const ADMIN_PIN = "phoenixx2026";
const canPrice = () => S.user.role === "Admin";          // only Admins see pricing
const LOCK = '<span class="locked" title="Visible to Admins only">•••</span>';
const pv = v => canPrice() ? money(v) : LOCK;             // price value, gated

/* ---------- state ---------- */
let S = { clients: [], log: [], users: [], user: { name:"", role:"User" }, view:"board", seq: 1 };
let ui = { q:"", filters:{}, showFilters:false, dense:true, calMonth:new Date().getMonth(), calYear:new Date().getFullYear(), ready:false };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const uid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toISOString().slice(0, 10);
const money = n => { n = Number(n) || 0; if (!n) return "—";
  if (n >= 1e7) return "₹" + (n/1e7).toFixed(n%1e7?2:0) + " Cr";
  if (n >= 1e5) return "₹" + (n/1e5).toFixed(n%1e5?2:0) + " L";
  if (n >= 1e3) return "₹" + (n/1e3).toFixed(0) + "K"; return "₹" + n; };
const fdate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"2-digit" }) : "—";
const daysTo = d => d ? Math.round((new Date(d+"T00:00:00") - new Date(today()+"T00:00:00")) / 864e5) : null;

/* ---------- persistence ---------- */
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    // NOTE: the logged-in person (S.user) is intentionally NOT saved to the shared cloud —
    // each person signs in on their own device. Pipeline data AND the user-account list
    // (created by the admin) are shared so everyone authenticates against the same logins.
    const payload = { clients: S.clients, log: S.log.slice(0, 400), users: S.users };
    try {
      if (sb) {
        const stamp = new Date().toISOString();
        const { error } = await sb.from("pipeline_state")
          .upsert({ id: "main", data: payload, updated_at: stamp });
        if (error) throw error;
        lastStamp = stamp;                       // our own change — don't re-pull it
      } else {
        localStorage.setItem(KEY, JSON.stringify(payload));
      }
    } catch (e) { console.warn("Save failed — check Supabase keys / connection.", e); }
  }, 250);
}
async function load() {
  try {
    if (sb) {
      const { data, error } = await sb.from("pipeline_state")
        .select("data, updated_at").eq("id", "main").maybeSingle();
      if (error) throw error;
      if (data && data.data) { S.clients = data.data.clients || []; S.log = data.data.log || []; S.users = data.data.users || []; lastStamp = data.updated_at; return true; }
    } else {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); S.clients = d.clients || []; S.log = d.log || []; S.users = d.users || []; return true; }
    }
  } catch (e) { console.warn("Load failed — check Supabase keys / connection.", e); }
  return false;
}
/* Poll the cloud so teammates' changes appear without a manual refresh. */
async function pollRemote() {
  if (!sb || document.hidden || document.querySelector(".scrim")) return;   // don't interrupt editing
  try {
    const { data } = await sb.from("pipeline_state").select("updated_at").eq("id", "main").maybeSingle();
    if (data && data.updated_at && data.updated_at !== lastStamp) {
      await load(); render(); toast("Pipeline updated by a teammate");
    }
  } catch (e) { /* transient network issue — try again next tick */ }
}

function logIt(clientId, action, detail) {
  S.log.unshift({ id:uid(), clientId, action, detail:detail||"", who:S.user.name, at:new Date().toISOString() });
  save();
}

/* ---------- seed ---------- */
function seed() {
  const d = (o) => { const x = new Date(); x.setDate(x.getDate()+o); return x.toISOString().slice(0,10); };
  const base = (o) => Object.assign({
    id:uid(), company:"", industry:"", website:"", location:"Coimbatore", size:"", revenue:"", gst:"",
    contactName:"", designation:"", email:"", phone:"", whatsapp:"", linkedin:"",
    services:[], source:"Cold Call", requirement:"", pain:"", budget:"", timeline:"", competitor:"", decisionMaker:"", remarks:"",
    createdDate:today(), followUp:"", meeting:"", proposalDate:"", closing:"",
    proposalAmount:"", proposalLink:"", files:[], priority:"Medium", rating:3, tags:[], owner:OWNERS[0],
    status:"discovery", notes:[], archived:false
  }, o);
  S.clients = [
    base({ company:"Vaigai Constructions", industry:"Construction", contactName:"Senthil Kumar", designation:"Director", phone:"+91 98430 11223", email:"senthil@vaigaiconstruct.in", services:["Website Development","SEO"], budget:"180000", priority:"High", rating:4, tags:["Construction"], status:"proposal", proposalAmount:"185000", proposalDate:d(-4), followUp:d(0), closing:d(12), source:"Reference", requirement:"Corporate site with project gallery and lead capture.", pain:"Existing site is 9 years old and not mobile friendly.", decisionMaker:"Senthil Kumar", competitor:"A local freelancer", notes:[{ id:uid(), text:"Wants the project gallery to load fast on 4G. Sent revised quote.", who:"Priya Kumar", at:new Date(Date.now()-864e5*2).toISOString() }] }),
    base({ company:"Kovai Sports Arena", industry:"Sports", contactName:"Ramya Devi", designation:"Owner", phone:"+91 90031 45566", email:"ramya@kovaisports.com", services:["Mobile App","Digital Marketing"], budget:"450000", priority:"High", rating:5, tags:["Sports","Startup"], status:"meeting", meeting:d(1), followUp:d(1), source:"Instagram", requirement:"Turf booking app with UPI payments and slot management.", pain:"Bookings handled over WhatsApp, double-booking every week.", decisionMaker:"Ramya Devi" }),
    base({ company:"Sri Lakshmi Textiles", industry:"Manufacturing", contactName:"Bala Murugan", designation:"GM Operations", phone:"+91 94433 78901", email:"bala@srilakshmitex.com", services:["ERP","Cloud"], budget:"900000", priority:"Medium", rating:4, tags:["Manufacturing"], status:"approached", followUp:d(3), source:"Cold Call", requirement:"ERP for production planning across two units.", owner:OWNERS[2] }),
    base({ company:"Nova Dental Care", industry:"Healthcare", contactName:"Dr. Anitha R.", designation:"Founder", phone:"+91 99406 22110", email:"contact@novadental.in", services:["Website Development","Google Ads","Branding"], budget:"120000", priority:"Medium", rating:3, tags:["Healthcare"], status:"converted", proposalAmount:"132000", closing:d(-6), source:"Google", owner:OWNERS[1], notes:[{ id:uid(), text:"Onboarded. Kickoff call done, brand assets received.", who:"Divya S.", at:new Date(Date.now()-864e5*5).toISOString() }] }),
    base({ company:"Greenfield Realty", industry:"Real Estate", contactName:"Mohan Das", designation:"Sales Head", phone:"+91 98946 33440", email:"mohan@greenfieldrealty.co", services:["Meta Ads","CRM"], budget:"260000", priority:"Low", rating:2, tags:["Real Estate"], status:"lost", source:"LinkedIn", remarks:"Went with an agency offering a lower retainer.", owner:OWNERS[3] }),
    base({ company:"Athena Academy", industry:"Education", contactName:"Fathima N.", designation:"Administrator", phone:"+91 96770 55882", email:"admin@athenaacademy.edu.in", services:["Software Development","AI Automation"], budget:"340000", priority:"High", rating:4, tags:["Education"], status:"discovery", followUp:d(2), source:"Event", requirement:"Admissions portal with automated follow-ups." }),
    base({ company:"Urban Cart Retail", industry:"Retail", contactName:"Vignesh S.", designation:"Co-founder", phone:"+91 73970 66123", email:"vignesh@urbancart.in", services:["Website Development","SEO","Meta Ads"], budget:"210000", priority:"Medium", rating:3, tags:["Retail","Startup"], status:"proposal", proposalAmount:"228000", proposalDate:d(-9), followUp:d(-1), closing:d(6), source:"Website", owner:OWNERS[1] })
  ];
  S.log = [{ id:uid(), clientId:S.clients[0].id, action:"Sample data loaded", detail:"7 demo clients created", who:"System", at:new Date().toISOString() }];
  save();
}

/* ---------- derived ---------- */
function visible() {
  const q = ui.q.trim().toLowerCase(), f = ui.filters;
  return S.clients.filter(c => {
    if (S.view === "archive" ? !c.archived : c.archived) return false;
    if (q) {
      const hay = [c.company,c.contactName,c.phone,c.whatsapp,c.email,c.industry,c.location,(c.tags||[]).join(" "),(c.services||[]).join(" ")].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (f.status && c.status !== f.status) return false;
    if (f.industry && c.industry !== f.industry) return false;
    if (f.priority && c.priority !== f.priority) return false;
    if (f.source && c.source !== f.source) return false;
    if (f.owner && c.owner !== f.owner) return false;
    if (f.minValue && Number(c.proposalAmount || c.budget || 0) < Number(f.minValue)) return false;
    if (f.from && (c.createdDate || "") < f.from) return false;
    if (f.to && (c.createdDate || "") > f.to) return false;
    if (f.due === "today" && c.followUp !== today()) return false;
    if (f.due === "overdue" && !(c.followUp && c.followUp < today())) return false;
    if (f.due === "week" && !(c.followUp && daysTo(c.followUp) >= 0 && daysTo(c.followUp) <= 7)) return false;
    return true;
  });
}
function stats(list) {
  const by = id => list.filter(c => c.status === id).length;
  const live = list.filter(c => !c.archived);
  const closed = live.filter(c => c.status === "converted");
  const decided = by("converted") + by("lost");
  return {
    total: live.length, discovery: by("discovery"), approached: by("approached"), meeting: by("meeting"),
    proposal: by("proposal"), converted: by("converted"), lost: by("lost"),
    conv: decided ? Math.round(by("converted") / decided * 100) : 0,
    pipeline: live.filter(c => !["converted","lost"].includes(c.status)).reduce((s,c) => s + Number(c.proposalAmount || c.budget || 0), 0),
    revenue: closed.reduce((s,c) => s + Number(c.proposalAmount || c.budget || 0), 0),
    due: live.filter(c => c.followUp && c.followUp <= today() && !["converted","lost"].includes(c.status)).length,
    meetToday: live.filter(c => c.meeting === today()).length
  };
}
function alerts() {
  const out = [];
  S.clients.filter(c => !c.archived).forEach(c => {
    if (c.followUp === today()) out.push({ c, k:"#FF6B00", t:"Follow-up due today", s:c.company });
    else if (c.followUp && c.followUp < today() && !["converted","lost"].includes(c.status)) out.push({ c, k:"#FF4D4D", t:"Follow-up overdue", s:c.company + " · " + fdate(c.followUp) });
    if (c.meeting === today()) out.push({ c, k:"#A57BFF", t:"Meeting today", s:c.company });
    if (c.status === "proposal" && c.proposalDate && daysTo(c.proposalDate) <= -7) out.push({ c, k:"#4C9AFF", t:"Proposal pending 7+ days", s:c.company });
    const dl = daysTo(c.closing);
    if (dl !== null && dl >= 0 && dl <= 5 && c.status !== "converted") out.push({ c, k:"#35C97A", t:"Expected close in " + dl + "d", s:c.company });
  });
  return out;
}

/* ---------- shell render ---------- */
function render() {
  renderTabs(); renderStats(); renderFilters();
  const v = $("#view");
  if (S.view === "analytics") v.innerHTML = viewAnalytics();
  else if (S.view === "calendar") { v.innerHTML = viewCalendar(); wireCalendar(); }
  else { v.innerHTML = viewBoard(); wireBoard(); }
  const a = alerts(); const b = $("#bellCount");
  b.textContent = a.length; b.style.display = a.length ? "grid" : "none";
}
function renderTabs() {
  const tabs = [["board","Pipeline board"],["analytics","Analytics"],["calendar","Calendar"],["archive","Archive"]];
  $("#tabs").innerHTML = tabs.map(([k,l]) => `<button class="tab ${S.view===k||(k==="board"&&S.view==="archive"&&false)?"on":""}" data-tab="${k}">${l}</button>`).join("")
    + `<div style="flex:1"></div>
       <button class="tab" data-act="density">${ui.dense ? "Compact cards" : "Detailed cards"}</button>
       <button class="tab" data-act="export-csv">Export CSV</button>
       <button class="tab" data-act="export-json">Backup</button>
       <button class="tab" data-act="print">Print / PDF</button>`;
}
function renderStats() {
  const list = S.clients.filter(c => !c.archived), s = stats(list);
  let cells = [
    ["Total clients", s.total, "", "#FFFFFF"], ["Discovery", s.discovery, "", COL("discovery").c],
    ["Approached", s.approached, "", COL("approached").c], ["Meetings", s.meeting, "", COL("meeting").c],
    ["Proposals", s.proposal, "", COL("proposal").c], ["Converted", s.converted, "", COL("converted").c],
    ["Lost", s.lost, "", COL("lost").c], ["Conversion", s.conv + "%", "of decided deals", "#FF6B00"],
    ["Pipeline value", money(s.pipeline), "open deals", "#FFA35C"], ["Revenue closed", money(s.revenue), "won deals", "#35C97A"],
    ["Follow-ups due", s.due, "today or overdue", "#FF4D4D"], ["Meetings today", s.meetToday, "", "#A57BFF"]
  ];
  if (!canPrice()) cells = cells.filter(c => !["Pipeline value","Revenue closed"].includes(c[0]));
  $("#stats").innerHTML = cells.map(([l,v,sub,c]) =>
    `<div class="stat" style="--c:${c}"><i>${l}</i><b>${esc(v)}</b>${sub?`<em>${sub}</em>`:""}</div>`).join("");
}
function renderFilters() {
  const f = ui.filters;
  const sel = (name, label, opts, cur) => `<div class="fgroup"><label>${label}</label><select data-f="${name}">
    <option value="">All</option>${opts.map(o => `<option ${cur===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
  $("#filters").className = "filters glass" + (ui.showFilters ? " open" : "");
  $("#filters").innerHTML =
    `<div class="fgroup"><label>Stage</label><select data-f="status"><option value="">All</option>
      ${COLS.map(c => `<option value="${c.id}" ${f.status===c.id?"selected":""}>${c.t}</option>`).join("")}</select></div>`
    + sel("industry","Industry",INDUSTRIES,f.industry)
    + sel("priority","Priority",["High","Medium","Low"],f.priority)
    + sel("source","Lead source",SOURCES,f.source)
    + sel("owner","Assigned to",OWNERS,f.owner)
    + `<div class="fgroup"><label>Follow-up</label><select data-f="due">
        <option value="">Any</option><option value="today" ${f.due==="today"?"selected":""}>Due today</option>
        <option value="overdue" ${f.due==="overdue"?"selected":""}>Overdue</option>
        <option value="week" ${f.due==="week"?"selected":""}>Next 7 days</option></select></div>`
    + `<div class="fgroup"><label>Min value (₹)</label><input type="number" data-f="minValue" value="${esc(f.minValue||"")}" style="width:120px" placeholder="0"></div>`
    + `<div class="fgroup"><label>Created from</label><input type="date" data-f="from" value="${esc(f.from||"")}"></div>`
    + `<div class="fgroup"><label>Created to</label><input type="date" data-f="to" value="${esc(f.to||"")}"></div>`
    + `<button class="btn ghost" data-act="clear-filters">Clear filters</button>`;
}

/* ---------- board ---------- */
function viewBoard() {
  const list = visible();
  if (S.view === "archive" && !list.length)
    return `<div class="glass" style="padding:44px;text-align:center"><h3 style="font-family:var(--display);margin:0 0 6px">Archive is empty</h3>
      <p style="color:var(--muted);margin:0;font-size:13px">Archived clients stay out of the board but keep their history. Use a card's menu to archive one.</p></div>`;
  return `<div class="board">${COLS.map(col => {
    const cards = list.filter(c => c.status === col.id);
    return `<section class="col" style="--k:${col.c}" data-col="${col.id}">
      <div class="colhead"><div class="row"><span class="pip"></span><h3>${col.t}</h3><span class="count">${cards.length}</span></div>
        <p>${col.d}</p>
        <button class="add" data-add="${col.id}">+ Add client</button></div>
      <div class="cards" data-drop="${col.id}">
        ${cards.length ? cards.map(cardHTML).join("") : `<div class="empty">Nothing here yet.<br>Drop a card or add a client.</div>`}
      </div></section>`;
  }).join("")}</div>
  <p class="hint">Drag a card to another column to update its stage. Every move is recorded in the client's timeline.</p>`;
}
function cardHTML(c) {
  return ui.dense ? cardSlim(c) : cardFull(c);
}
function cardSlim(c) {
  const col = COL(c.status), d = daysTo(c.followUp);
  const due = c.followUp ? (d === 0 ? "Today" : d < 0 ? (-d) + "d late" : fdate(c.followUp).slice(0, 6)) : "";
  const svc = (c.services || [])[0];
  return `<article class="card slim" draggable="true" data-id="${c.id}" title="${esc(c.company)} · ${esc(c.contactName||"")}">
    <div class="top"><span class="pdot ${c.priority}" title="${c.priority} priority"></span>
      <h4>${esc(c.company)}</h4>
      <button class="kebab" data-menu="${c.id}" aria-label="Card actions">⋯</button></div>
    <div class="srow"><span class="t">${esc(c.contactName || "No contact")}</span>
      <b>${pv(c.proposalAmount || c.budget)}</b></div>
    <div class="srow sub">
      <span class="t">${svc ? esc(svc) + ((c.services||[]).length > 1 ? " +" + (c.services.length-1) : "") : esc(c.industry || "—")}</span>
      ${due ? `<span class="${d <= 0 ? "due" : ""}">${due}</span>` : `<span style="color:${col.c}">${col.t.split(" ")[0]}</span>`}</div>
  </article>`;
}

function wireBoard() {
  let dragId = null;
  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("dragstart", e => { dragId = el.dataset.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); dragId = null; document.querySelectorAll(".col.over").forEach(c => c.classList.remove("over")); });
    el.addEventListener("click", e => { if (e.target.closest(".kebab")) return; openDetail(el.dataset.id); });
  });
  document.querySelectorAll("[data-drop]").forEach(zone => {
    const col = zone.closest(".col");
    zone.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    zone.addEventListener("dragleave", e => { if (!zone.contains(e.relatedTarget)) col.classList.remove("over"); });
    zone.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("over");
      const id = dragId || e.dataTransfer.getData("text/plain"); moveClient(id, zone.dataset.drop); });
  });
  document.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => openForm(null, b.dataset.add)));
  document.querySelectorAll("[data-menu]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); cardMenu(b.dataset.menu, b); }));
}
function moveClient(id, status) {
  const c = S.clients.find(x => x.id === id);
  if (!c || c.status === status) return;
  const from = COL(c.status).t; c.status = status;
  if (status === "meeting" && !c.meeting) c.meeting = today();
  if (status === "proposal" && !c.proposalDate) c.proposalDate = today();
  if (status === "converted" && !c.closing) c.closing = today();
  logIt(c.id, "Stage changed", from + " → " + COL(status).t);
  save(); render(); toast(`<b>${esc(c.company)}</b> moved to ${COL(status).t}`);
}

/* ---------- card menu ---------- */
function cardMenu(id, anchor) {
  closeMenus();
  const c = S.clients.find(x => x.id === id); if (!c) return;
  const m = document.createElement("div"); m.className = "menu"; m.dataset.pop = "1";
  m.innerHTML = `
    <button data-a="view">View details</button>
    <button data-a="edit">Edit client</button>
    <button data-a="dup">Duplicate</button>
    <button data-a="proposal">Download proposal</button>
    <hr><div class="head">Move to</div>
    ${COLS.filter(x => x.id !== c.status).map(x => `<button data-move="${x.id}"><span style="width:7px;height:7px;border-radius:9px;background:${x.c}"></span>${x.t}</button>`).join("")}
    <hr>
    <button data-a="archive">${c.archived ? "Restore from archive" : "Archive"}</button>
    <button class="danger" data-a="del">Delete</button>`;
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.min(r.left - 150, innerWidth - m.offsetWidth - 12) + "px";
  m.style.top = Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 12) + "px";
  m.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    closeMenus();
    if (b.dataset.move) return moveClient(id, b.dataset.move);
    const a = b.dataset.a;
    if (a === "view") openDetail(id);
    if (a === "edit") openForm(c);
    if (a === "dup") { const n = JSON.parse(JSON.stringify(c)); n.id = uid(); n.company = c.company + " (copy)"; n.createdDate = today(); n.notes = []; S.clients.unshift(n); logIt(n.id, "Client duplicated", "from " + c.company); save(); render(); toast("Client duplicated"); }
    if (a === "proposal") downloadProposal(c);
    if (a === "archive") { c.archived = !c.archived; logIt(c.id, c.archived ? "Archived" : "Restored", ""); save(); render(); toast(c.archived ? "Client archived" : "Client restored"); }
    if (a === "del") { if (confirm("Delete " + c.company + " permanently? This cannot be undone.")) { S.clients = S.clients.filter(x => x.id !== id); logIt(id, "Client deleted", c.company); save(); render(); toast("Client deleted"); } }
  });
}
function closeMenus() { document.querySelectorAll("[data-pop]").forEach(e => e.remove()); }
document.addEventListener("click", e => { if (!e.target.closest("[data-pop]") && !e.target.closest("[data-menu]") && !e.target.closest("#bell") && !e.target.closest("#me")) closeMenus(); });
addEventListener("keydown", e => { if (e.key === "Escape") { closeMenus(); const s = $(".scrim"); if (s && !s.dataset.login) s.remove(); } });

/* ---------- toast ---------- */
function toast(html) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------- modal shell ---------- */
function modal(title, bodyHTML, footHTML) {
  const s = document.createElement("div"); s.className = "scrim";
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <header><h2>${title}</h2><button class="iconbtn" data-close>✕</button></header>
      <div class="body">${bodyHTML}</div>${footHTML ? `<div class="actions">${footHTML}</div>` : ""}</div>`;
  s.addEventListener("mousedown", e => { if (e.target === s) s.remove(); });
  s.querySelector("[data-close]").addEventListener("click", () => s.remove());
  document.body.appendChild(s);
  return s;
}

/* ---------- client form ---------- */

  const ta = (id, label, val, ph) => `<div class="f wide"><label for="${id}">${label}</label><textarea id="${id}" placeholder="${ph||""}">${esc(val||"")}</textarea></div>`;

  const s = modal(isNew ? "New client" : "Edit " + esc(c.company), `
    <div class="sec"><h5>Company</h5><div class="grid">
      ${t("f_company","Company name", c.company, "text", true)}
      <div class="f"><label>Industry</label><select id="f_industry"><option value="">Select…</option>${INDUSTRIES.map(i => `<option ${c.industry===i?"selected":""}>${i}</option>`).join("")}</select></div>
      ${t("f_website","Website", c.website, "url")}${t("f_location","Location", c.location)}
      ${sel("f_size","Company size",["","1–10","11–50","51–200","201–500","500+"], c.size||"")}
      ${t("f_revenue","Annual revenue", c.revenue)}${t("f_gst","GST number", c.gst)}
      <div class="f"><label>Assigned to</label><select id="f_owner">${OWNERS.map(o => `<option ${c.owner===o?"selected":""}>${o}</option>`).join("")}</select></div>
    </div></div>

    <div class="sec"><h5>Contact person</h5><div class="grid">
      ${t("f_contactName","Contact name", c.contactName, "text", true)}
      ${t("f_designation","Designation", c.designation)}
      ${t("f_email","Email", c.email, "email")}
      ${t("f_phone","Phone number", c.phone, "tel", true)}
      ${t("f_whatsapp","WhatsApp number", c.whatsapp, "tel")}
      ${t("f_linkedin","LinkedIn profile", c.linkedin, "url")}
    </div></div>

    <div class="sec"><h5>Business</h5>
      <div class="f wide" style="margin-bottom:12px"><label>Services interested in</label>
        <div class="pills" id="f_services">${SERVICES.map(sv => `<button type="button" class="pill ${(c.services||[]).includes(sv)?"on":""}" data-v="${esc(sv)}">${sv}</button>`).join("")}</div></div>
      <div class="grid">
        <div class="f"><label>Lead source</label><select id="f_source">${SOURCES.map(o => `<option ${c.source===o?"selected":""}>${o}</option>`).join("")}</select></div>
        ${canPrice() ? t("f_budget","Budget (₹)", c.budget, "number") : ""}
        ${t("f_timeline","Timeline", c.timeline)}
        ${t("f_competitor","Competitor", c.competitor)}
        ${t("f_decisionMaker","Decision maker", c.decisionMaker)}
      </div>
      <div class="grid" style="margin-top:11px">
        ${ta("f_requirement","Current requirement","What are they asking for?")}
        ${ta("f_pain","Pain points","What is broken or costing them today?")}
        ${ta("f_remarks","Remarks","Anything the team should know before the next call.")}
      </div></div>

    <div class="sec"><h5>Dates</h5><div class="grid">
      ${t("f_createdDate","Created date", c.createdDate || today(), "date")}
      ${t("f_followUp","Follow-up date", c.followUp, "date")}
      ${t("f_meeting","Meeting date", c.meeting, "date")}
      ${t("f_proposalDate","Proposal date", c.proposalDate, "date")}
      ${t("f_closing","Expected closing", c.closing, "date")}
    </div></div>

    <div class="sec"><h5>Proposal &amp; priority</h5><div class="grid">
      ${canPrice() ? t("f_proposalAmount","Proposal amount (₹)", c.proposalAmount, "number") : ""}
      ${t("f_proposalLink","Proposal link", c.proposalLink, "url")}
      ${sel("f_priority","Priority",["High","Medium","Low"], c.priority)}
      <div class="f"><label>Stage</label><select id="f_status">${COLS.map(x => `<option value="${x.id}" ${c.status===x.id?"selected":""}>${x.t}</option>`).join("")}</select></div>
      <div class="f"><label>Client rating</label><div class="rate" id="f_rate">${[1,2,3,4,5].map(n => `<span class="${n<=(c.rating||0)?"on":""}" data-n="${n}">★</span>`).join("")}</div></div>
    </div>
    <div class="f wide" style="margin-top:12px"><label>Tags</label>
      <div class="pills" id="f_tags">${TAGS.map(tg => `<button type="button" class="pill ${(c.tags||[]).includes(tg)?"on":""}" data-v="${esc(tg)}">${tg}</button>`).join("")}</div></div>

    <div class="sec"><h5>Attachments</h5>
      <div class="drop" id="f_drop">Choose files — proposals, quotations, contracts, decks, images<br>
        <span style="font-size:10.5px">File names and sizes are stored with the client record.</span></div>
      <input type="file" id="f_file" multiple hidden>
      <div class="filelist" id="f_files"></div></div>`,
    `<button class="btn ghost" data-close2>Cancel</button><button class="btn primary" id="f_save">${isNew ? "Save client" : "Save changes"}</button>`);

  let rating = c.rating || 3, files = (c.files || []).slice();
  s.querySelector("[data-close2]").addEventListener("click", () => s.remove());
  s.querySelectorAll("#f_services .pill, #f_tags .pill").forEach(p => p.addEventListener("click", () => p.classList.toggle("on")));
  s.querySelectorAll("#f_rate span").forEach(st => st.addEventListener("click", () => { rating = +st.dataset.n; s.querySelectorAll("#f_rate span").forEach(x => x.classList.toggle("on", +x.dataset.n <= rating)); }));
  const paint = () => s.querySelector("#f_files").innerHTML = files.map((f, i) =>

  paint();
  s.querySelector("#f_files").addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (b) { files.splice(+b.dataset.rm, 1); paint(); } });
  s.querySelector("#f_drop").addEventListener("click", () => s.querySelector("#f_file").click());
  s.querySelector("#f_file").addEventListener("change", e => {
    [...e.target.files].forEach(f => files.push({ name:f.name, size:(f.size/1024 < 1024 ? (f.size/1024).toFixed(0)+" KB" : (f.size/1048576).toFixed(1)+" MB"), at:new Date().toISOString() }));
    paint();
  });

  s.querySelector("#f_save").addEventListener("click", () => {
    const g = id => { const el = s.querySelector("#f_" + id); return el ? el.value.trim() : ""; };
    if (!g("company") || !g("contactName") || !g("phone")) { toast("Company name, contact name and phone number are required."); return; }
    const picked = sel => [...s.querySelectorAll(sel + " .pill.on")].map(p => p.dataset.v);
    // Users can't see or edit pricing fields — preserve whatever the client already had.
    const budget = canPrice() ? g("budget") : (c.budget || "");
    const proposalAmount = canPrice() ? g("proposalAmount") : (c.proposalAmount || "");
    const data = { company:g("company"), industry:g("industry"), website:g("website"), location:g("location"), size:g("size"),
      revenue:g("revenue"), gst:g("gst"), owner:g("owner"), contactName:g("contactName"), designation:g("designation"),
      email:g("email"), phone:g("phone"), whatsapp:g("whatsapp"), linkedin:g("linkedin"),
      services:picked("#f_services"), source:g("source"), budget, timeline:g("timeline"),
      competitor:g("competitor"), decisionMaker:g("decisionMaker"), requirement:g("requirement"), pain:g("pain"),
      remarks:g("remarks"), createdDate:g("createdDate"), followUp:g("followUp"), meeting:g("meeting"),
      proposalDate:g("proposalDate"), closing:g("closing"), proposalAmount,
      proposalLink:g("proposalLink"), priority:g("priority"), status:g("status"), rating, tags:picked("#f_tags"), files };
    if (isNew) {
      const n = Object.assign({ id:uid(), notes:[], archived:false }, data);
      S.clients.unshift(n); logIt(n.id, "Client created", n.company);
      toast(`<b>${esc(n.company)}</b> added to ${COL(n.status).t}`);
    } else {
      const before = client.status; Object.assign(client, data);
      logIt(client.id, "Client edited", before !== client.status ? "stage → " + COL(client.status).t : "details updated");
      toast("Changes saved");
    }
    save(); s.remove(); render();
  });
}

function dl(text, name, type) {

  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCSV() {

/* ---------- analytics ---------- */
function viewAnalytics() {
  const list = S.clients.filter(c => !c.archived), s = stats(list);
  const months = [...Array(6)].map((_, i) => { const d = new Date(); d.setMonth(d.getMonth() - (5 - i)); return { k:d.toISOString().slice(0,7), l:d.toLocaleDateString("en-IN",{month:"short"}) }; });
  const leadsBy = months.map(m => list.filter(c => (c.createdDate||"").startsWith(m.k)).length);
  const revBy = months.map(m => list.filter(c => c.status === "converted" && (c.closing||"").startsWith(m.k)).reduce((a,c) => a + Number(c.proposalAmount||c.budget||0), 0));
  const maxL = Math.max(1, ...leadsBy), maxR = Math.max(1, ...revBy);
  const group = key => { const m = {}; list.forEach(c => { const v = Array.isArray(c[key]) ? c[key] : [c[key] || "Unspecified"]; v.forEach(x => m[x] = (m[x]||0)+1); }); return Object.entries(m).sort((a,b) => b[1]-a[1]); };
  const inds = group("industry"), srcs = group("source").slice(0, 6), svcs = group("services").slice(0, 8);
  const maxI = Math.max(1, ...inds.map(x => x[1])), maxS = Math.max(1, ...svcs.map(x => x[1]));
  const funnelMax = Math.max(1, ...COLS.map(c => list.filter(x => x.status === c.id).length));
  const totalSrc = srcs.reduce((a, x) => a + x[1], 0) || 1;
  const palette = ["#FF6B00","#4C9AFF","#A57BFF","#35C97A","#FFC978","#FF8A8A"];
  let acc = 0;
  const donut = srcs.map((sc, i) => { const frac = sc[1]/totalSrc, dash = frac*339.3, o = -acc*339.3; acc += frac;
    return `<circle r="54" cx="60" cy="60" fill="none" stroke="${palette[i%6]}" stroke-width="13" stroke-dasharray="${dash.toFixed(1)} 339.3" stroke-dashoffset="${o.toFixed(1)}" transform="rotate(-90 60 60)"/>`; }).join("");
  const valueBy = COLS.map(c => ({ c, v: list.filter(x => x.status === c.id).reduce((a,x) => a + Number(x.proposalAmount||x.budget||0), 0) }));
  const maxV = Math.max(1, ...valueBy.map(x => x.v));

  return `<div class="panels">
    <div class="panel glass"><h3>Monthly leads</h3><p class="sub">New clients added, last six months</p>
      <div class="cols6">${months.map((m,i) => `<div class="cbar"><em>${leadsBy[i]}</em><div class="b" style="height:${(leadsBy[i]/maxL*100).toFixed(0)}%"></div><span>${m.l}</span></div>`).join("")}</div></div>

    <div class="panel glass"><h3>Conversion funnel</h3><p class="sub">${s.conv}% of decided deals closed</p>
      <div class="funnel">${COLS.map(c => { const n = list.filter(x => x.status === c.id).length;
        return `<div class="fstep" style="--k:${c.c};width:${Math.max(38, n/funnelMax*100).toFixed(0)}%"><span>${c.t}</span><b>${n}</b></div>`; }).join("")}</div></div>

    <div class="panel glass"><h3>Industry breakdown</h3><p class="sub">Where the pipeline is concentrated</p>
      <div class="bars">${inds.length ? inds.map(([k,v]) => `<div class="bar"><span class="t">${esc(k||"Unspecified")}</span>
        <span class="track"><span class="fill" style="width:${(v/maxI*100).toFixed(0)}%"></span></span><span class="v">${v}</span></div>`).join("") : emptyChart()}</div></div>

    <div class="panel glass"><h3>Lead sources</h3><p class="sub">Which channels bring clients in</p>
      <div class="donut"><svg width="120" height="120" viewBox="0 0 120 120">
        <circle r="54" cx="60" cy="60" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="13"/>${donut}
        <text x="60" y="58" text-anchor="middle" fill="#F4F4F6" font-size="21" font-family="Space Grotesk,sans-serif">${list.length}</text>
        <text x="60" y="74" text-anchor="middle" fill="#6C6C79" font-size="9" letter-spacing="1.4">CLIENTS</text></svg>
        <div class="legend">${srcs.map(([k,v],i) => `<div><i style="background:${palette[i%6]}"></i>${esc(k)}<b>${v}</b></div>`).join("") || emptyChart()}</div></div></div>

    ${canPrice() ? `<div class="panel glass"><h3>Proposal value by stage</h3><p class="sub">Money sitting in each column</p>
      <div class="bars">${valueBy.map(x => `<div class="bar"><span class="t">${x.c.t}</span>
        <span class="track"><span class="fill" style="width:${(x.v/maxV*100).toFixed(0)}%;background:linear-gradient(90deg,${x.c.c},${x.c.c}55)"></span></span>
        <span class="v">${money(x.v)}</span></div>`).join("")}</div></div>

    <div class="panel glass"><h3>Revenue closed</h3><p class="sub">Won deals by expected close month</p>
      <div class="cols6">${months.map((m,i) => `<div class="cbar"><em>${revBy[i] ? money(revBy[i]) : "—"}</em>
        <div class="b" style="height:${(revBy[i]/maxR*100).toFixed(0)}%;background:linear-gradient(180deg,#35C97A,rgba(53,201,122,.2))"></div><span>${m.l}</span></div>`).join("")}</div></div>` : ""}

    <div class="panel glass"><h3>Services in demand</h3><p class="sub">Across every open and closed client</p>
      <div class="bars">${svcs.length ? svcs.map(([k,v]) => `<div class="bar"><span class="t">${esc(k)}</span>
        <span class="track"><span class="fill" style="width:${(v/maxS*100).toFixed(0)}%"></span></span><span class="v">${v}</span></div>`).join("") : emptyChart()}</div></div>

    <div class="panel glass"><h3>Team load</h3><p class="sub">Open clients per person</p>
      <div class="bars">${OWNERS.map(o => { const n = list.filter(c => c.owner === o && !["converted","lost"].includes(c.status)).length;
        const mx = Math.max(1, ...OWNERS.map(x => list.filter(c => c.owner === x && !["converted","lost"].includes(c.status)).length));
        return `<div class="bar"><span class="t">${o}</span><span class="track"><span class="fill" style="width:${(n/mx*100).toFixed(0)}%"></span></span><span class="v">${n}</span></div>`; }).join("")}</div></div>
  </div>`;
}
const emptyChart = () => `<p style="color:var(--faint);font-size:12px;margin:0">Nothing to chart yet. Add a client to see this fill in.</p>`;

/* ---------- calendar ---------- */
function viewCalendar() {
  const y = ui.calYear, m = ui.calMonth;
  const first = new Date(y, m, 1), start = first.getDay(), dim = new Date(y, m+1, 0).getDate(), pdim = new Date(y, m, 0).getDate();
  const evs = {};
  const push = (d, k, label, id) => { if (!d) return; (evs[d] = evs[d] || []).push({ k, label, id }); };
  S.clients.filter(c => !c.archived).forEach(c => {
    push(c.meeting, "#A57BFF", "Meeting · " + c.company, c.id);
    push(c.followUp, "#FF6B00", "Follow-up · " + c.company, c.id);
    push(c.proposalDate, "#4C9AFF", "Proposal · " + c.company, c.id);
    push(c.closing, "#35C97A", "Close · " + c.company, c.id);
  });
  const cell = (dayNum, mute, iso) => {
    const list = (evs[iso] || []).slice(0, 4);
    return `<div class="day ${mute ? "mute" : ""} ${iso === today() ? "today" : ""}">
      <span class="n">${dayNum}</span>
      ${list.map(e => `<div class="ev" style="--k:${e.k}" data-open="${e.id}" title="${esc(e.label)}">${esc(e.label)}</div>`).join("")}
      ${(evs[iso]||[]).length > 4 ? `<span style="font-size:9px;color:var(--faint)">+${evs[iso].length-4} more</span>` : ""}</div>`;
  };
  let cells = "";
  for (let i = start - 1; i >= 0; i--) cells += cell(pdim - i, true, "");
  for (let d = 1; d <= dim; d++) cells += cell(d, false, `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  const tail = (7 - ((start + dim) % 7)) % 7;
  for (let d = 1; d <= tail; d++) cells += cell(d, true, "");
  const legend = [["#A57BFF","Meetings"],["#FF6B00","Follow-ups"],["#4C9AFF","Proposals sent"],["#35C97A","Expected close"]];
  return `<div class="panel glass" style="padding:18px">
    <div class="calhead"><h3>${first.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</h3>
      <div class="legend" style="flex-direction:row;gap:12px;flex:none;flex-wrap:wrap">${legend.map(([c,l]) => `<div><i style="background:${c}"></i>${l}</div>`).join("")}</div>
      <button class="btn" data-cal="-1">‹</button><button class="btn" data-cal="0">Today</button><button class="btn" data-cal="1">›</button></div>
    <div class="cal">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div></div>`;
}
function wireCalendar() {
  document.querySelectorAll("[data-cal]").forEach(b => b.addEventListener("click", () => {
    const v = +b.dataset.cal;
    if (v === 0) { const n = new Date(); ui.calMonth = n.getMonth(); ui.calYear = n.getFullYear(); }
    else { ui.calMonth += v; if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; } if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; } }
    render();
  }));
  document.querySelectorAll("[data-open]").forEach(e => e.addEventListener("click", () => openDetail(e.dataset.open)));
}

    if (a === "wipe") { if (confirm("Clear every client and all history? This cannot be undone.")) { S.clients = []; S.log = []; save(); render(); toast("All data cleared"); } }

    S.users.push({ id: uid(), name, pin, createdBy: S.user.name, at: new Date().toISOString() });
    save(); repaint();
    s.querySelector("#mu_name").value = ""; s.querySelector("#mu_pin").value = "";
    toast(`User <b>${esc(name)}</b> created`);
  });
  s.querySelector("#mu_list").addEventListener("click", e => {
    const rb = e.target.closest("[data-reset-user]");
    if (rb) {
      const u = (S.users || []).find(x => x.id === rb.dataset.resetUser); if (!u) return;
      const np = prompt(`Set a new passcode for "${u.name}".\nTheir current passcode is: ${u.pin}`, u.pin);
      if (np === null) return;
      const pin = np.trim();
      if (!pin) { toast("Passcode can't be empty."); return; }
      u.pin = pin; save(); repaint(); toast(`Passcode for <b>${esc(u.name)}</b> updated`);
      return;
    }
    const b = e.target.closest("[data-del-user]"); if (!b) return;
    const u = (S.users || []).find(x => x.id === b.dataset.delUser); if (!u) return;
    if (!confirm(`Remove the login for "${u.name}"? They will no longer be able to sign in.`)) return;
    S.users = S.users.filter(x => x.id !== u.id); save(); repaint(); toast("User removed");
  });
}

function startApp() {
  $("#me").textContent = (S.user.name || "PX").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  renderRoleBadge();
  render();
  const bt = document.querySelector('.tab[data-tab="board"]'); if (bt) bt.classList.add("on");
}

/* ---------- events ---------- */
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"), a = e.target.closest("[data-act]");
  if (t) { S.view = t.dataset.tab; document.querySelectorAll(".tab[data-tab]").forEach(x => x.classList.toggle("on", x === t)); render(); }
  if (a) { const k = a.dataset.act;
    if (k === "density") { ui.dense = !ui.dense; render(); toast(ui.dense ? "Compact cards — more clients per column" : "Detailed cards"); }
    if (k === "export-csv") exportCSV();
    if (k === "export-json") { dl(JSON.stringify({ clients:S.clients, log:S.log, exported:new Date().toISOString() }, null, 2), "phoenixx-backup-" + today() + ".json", "application/json"); toast("Backup downloaded"); }
    if (k === "print") window.print(); }
});
$("#q").addEventListener("input", e => { ui.q = e.target.value; if (S.view === "analytics" || S.view === "calendar") S.view = "board"; render(); });
$("#filterBtn").addEventListener("click", () => { ui.showFilters = !ui.showFilters; $("#filterBtn").classList.toggle("on", ui.showFilters); renderFilters(); });
$("#filters").addEventListener("change", e => { const f = e.target.dataset.f; if (f) { ui.filters[f] = e.target.value; render(); } });
$("#filters").addEventListener("click", e => { if (e.target.dataset.act === "clear-filters") { ui.filters = {}; render(); } });
$("#bell").addEventListener("click", e => { e.stopPropagation(); if (document.querySelector(".nlist")) closeMenus(); else openBell(); });
$("#me").addEventListener("click", e => { e.stopPropagation(); openAccount(); });
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); $("#q").focus(); } });

/* ---------- boot ---------- */
(async () => {
  const had = await load();
  if (!had || !S.clients.length) seed();
  S.user = { name:"", role:"User" };   // never auto-restore Admin — pricing stays locked until sign-in
  showLogin();                    // startApp() runs after a successful sign-in
  if (sb) setInterval(pollRemote, 15000);   // live-sync teammates' changes every 15s
})();

})();

</script>
